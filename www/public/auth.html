<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMS IPWIJA - Login</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.card { background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); width: 100%; max-width: 460px; padding: 40px; }
.tabs { display: flex; margin-bottom: 30px; border-bottom: 2px solid #eee; gap: 0; }
.tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; font-weight: 600; color: #999; border-bottom: 3px solid transparent; transition: all 0.2s; }
.tab.active { color: #667eea; border-bottom-color: #667eea; }
.form { display: none; }
.form.active { display: block; }
.form-group { margin-bottom: 18px; }
label { display: block; margin-bottom: 6px; font-weight: 500; color: #444; font-size: 14px; }
input { width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; transition: border 0.2s; outline: none; }
input:focus { border-color: #667eea; }
.btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.btn-primary { background: #667eea; color: white; }
.btn-primary:hover { background: #5a6fd6; }
.btn-danger { background: #e74c3c; color: white; }
.btn-danger:hover { background: #c0392b; }
.btn-success { background: #27ae60; color: white; }
.message { margin-top: 16px; padding: 12px; border-radius: 8px; display: none; font-size: 14px; }
.message.error { display: block; background: #ffeaea; color: #c0392b; border: 1px solid #f5c6cb; }
.message.success { display: block; background: #eafaf1; color: #27ae60; border: 1px solid #b8e6c9; }
.dashboard { display: none; }
.dashboard.active { display: block; }
.user-info { background: #f8f9ff; padding: 16px; border-radius: 10px; margin: 20px 0; }
.user-info p { margin: 6px 0; font-size: 14px; color: #555; }
.user-info strong { color: #333; }
.back-link { text-align: center; margin-top: 16px; }
.back-link a { color: #667eea; cursor: pointer; font-size: 14px; }
h2 { text-align: center; margin-bottom: 8px; color: #333; }
.subtitle { text-align: center; color: #888; font-size: 14px; margin-bottom: 24px; }
.loading { display: none; text-align: center; margin: 10px 0; }
.loading.active { display: block; }
.spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top-color: #667eea; border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="card" id="app">
  <div id="authSection">
    <div style="text-align:center;margin-bottom:16px;">
      <h2>LMS IPWIJA</h2>
      <p class="subtitle">Laboratorium Management System</p>
    </div>
    <div class="tabs">
      <div class="tab active" onclick="switchTab('login')">Login</div>
      <div class="tab" onclick="switchTab('register')">Register</div>
    </div>

    <div id="loginForm" class="form active">
      <div class="form-group">
        <label>Email atau NIM</label>
        <input type="text" id="loginEmail" placeholder="email@ipwija.ac.id / NIM">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Masukkan password">
      </div>
      <button class="btn btn-primary" onclick="login()">Login</button>
      <div id="loginMessage" class="message"></div>
      <div id="loginLoading" class="loading"><div class="spinner"></div></div>
    </div>

    <div id="registerForm" class="form">
      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" id="regNama" placeholder="Nama lengkap">
      </div>
      <div class="form-group">
        <label>NIM</label>
        <input type="text" id="regNim" placeholder="Nomor Induk Mahasiswa">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="email@ipwija.ac.id">
      </div>
      <div class="form-group">
        <label>Program Studi</label>
        <input type="text" id="regProdi" placeholder="Contoh: Teknik Informatika">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="Minimal 8 karakter">
      </div>
      <div class="form-group">
        <label>Konfirmasi Password</label>
        <input type="password" id="regKonfirmasi" placeholder="Ulangi password">
      </div>
      <button class="btn btn-primary" onclick="register()">Daftar</button>
      <div id="registerMessage" class="message"></div>
      <div id="registerLoading" class="loading"><div class="spinner"></div></div>
    </div>
  </div>

  <div id="dashboardSection" class="dashboard">
    <div style="text-align:center;margin-bottom:16px;">
      <h2>Dashboard</h2>
      <p class="subtitle">Selamat datang di LMS IPWIJA</p>
    </div>
    <div class="user-info" id="userInfo"></div>
    <button class="btn btn-success" onclick="goToDashboard()">Buka Dashboard</button>
    <div class="back-link"><a onclick="logout()">Logout</a></div>
  </div>
</div>

<script>
const API = 'http://localhost:8000/api/v1/auth';
let token = localStorage.getItem('token');
let user = null;

if (token) { showDashboard(); }

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
  if (tab === 'login') {
    document.querySelectorAll('.tab')[0].classList.add('active');
    document.getElementById('loginForm').classList.add('active');
  } else {
    document.querySelectorAll('.tab')[1].classList.add('active');
    document.getElementById('registerForm').classList.add('active');
  }
  clearMessages();
}

function clearMessages() {
  document.querySelectorAll('.message').forEach(m => { m.className = 'message'; m.textContent = ''; });
}

function showMessage(el, text, type) {
  el.className = 'message ' + type;
  el.textContent = text;
}

async function login() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  const msg = document.getElementById('loginMessage');
  const loading = document.getElementById('loginLoading');
  clearMessages();

  if (!email || !password) { showMessage(msg, 'Email/NIM dan password wajib diisi.', 'error'); return; }

  loading.classList.add('active');
  try {
    const isEmail = email.includes('@');
    const body = isEmail ? { email, password } : { nim: email, password };
    const res = await fetch(API + '/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok) {
      const err = data.errors ? Object.values(data.errors).flat().join(', ') : data.message;
      showMessage(msg, err, 'error'); return;
    }
    token = data.data.token;
    user = data.data.user;
    localStorage.setItem('token', token);
    showDashboard();
  } catch (e) {
    showMessage(msg, 'Gagal terhubung ke server.', 'error');
  } finally {
    loading.classList.remove('active');
  }
}

async function register() {
  const nama = document.getElementById('regNama').value.trim();
  const nim = document.getElementById('regNim').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const prodi = document.getElementById('regProdi').value.trim();
  const password = document.getElementById('regPassword').value;
  const konfirmasi = document.getElementById('regKonfirmasi').value;
  const msg = document.getElementById('registerMessage');
  const loading = document.getElementById('registerLoading');
  clearMessages();

  if (!nama || !nim || !email || !prodi || !password || !konfirmasi) {
    showMessage(msg, 'Semua field wajib diisi.', 'error'); return;
  }
  if (password.length < 8) { showMessage(msg, 'Password minimal 8 karakter.', 'error'); return; }
  if (password !== konfirmasi) { showMessage(msg, 'Password dan konfirmasi tidak cocok.', 'error'); return; }

  loading.classList.add('active');
  try {
    const res = await fetch(API + '/register', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ nama_lengkap: nama, nim, email, program_studi: prodi, password, konfirmasi_password: konfirmasi })
    });
    const data = await res.json();
    if (!res.ok) {
      const err = data.errors ? Object.values(data.errors).flat().join(', ') : data.message;
      showMessage(msg, err, 'error'); return;
    }
    showMessage(msg, 'Registrasi berhasil! Silakan login.', 'success');
    document.getElementById('regNama').value = '';
    document.getElementById('regNim').value = '';
    document.getElementById('regEmail').value = '';
    document.getElementById('regProdi').value = '';
    document.getElementById('regPassword').value = '';
    document.getElementById('regKonfirmasi').value = '';
    setTimeout(() => switchTab('login'), 1500);
  } catch (e) {
    showMessage(msg, 'Gagal terhubung ke server.', 'error');
  } finally {
    loading.classList.remove('active');
  }
}

async function showDashboard() {
  if (!token) return;
  try {
    const res = await fetch(API + '/me', {
      headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/json' }
    });
    const data = await res.json();
    if (!res.ok) { localStorage.removeItem('token'); window.location.reload(); return; }
    user = data.data;
    document.getElementById('authSection').style.display = 'none';
    document.getElementById('dashboardSection').classList.add('active');
    document.getElementById('userInfo').innerHTML = `
      <p><strong>Nama:</strong> ${user.nama_lengkap}</p>
      <p><strong>NIM:</strong> ${user.nim}</p>
      <p><strong>Email:</strong> ${user.email}</p>
      <p><strong>Program Studi:</strong> ${user.program_studi}</p>
      <p><strong>Role:</strong> ${user.role}</p>
    `;
  } catch (e) { localStorage.removeItem('token'); window.location.reload(); }
}

function goToDashboard() {
  const url = user.role === 'admin' ? '/dashboard/admin' : '/dashboard/mahasiswa';
  window.open(API.replace('/auth', '') + url, '_blank');
}

async function logout() {
  if (!token) return;
  try {
    await fetch(API + '/logout', {
      method: 'POST', headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/json' }
    });
  } catch (e) {}
  localStorage.removeItem('token');
  token = null;
  user = null;
  document.getElementById('authSection').style.display = 'block';
  document.getElementById('dashboardSection').classList.remove('active');
}
</script>
</body>
</html>
